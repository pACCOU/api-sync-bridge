[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "api-sync-bridge"
version = "1.0.0"
description = "Reliable one-way sync of records between two REST APIs: retries, rate limiting, idempotency, incremental runs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Florian Whannou" }]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
syncbridge = "syncbridge.cli:main"

[tool.setuptools.packages.find]
include = ["syncbridge*"]
